<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{members/admin/fragments/admin-layout :: layout(
        '학식목장 관리자 - 운영 대시보드',
        'main',
        '운영 대시보드',
        ~{::content}
      )}">

<th:block th:fragment="content">
    <div id="dashboardLoading" class="dashboard-loading">운영 현황을 불러오는 중입니다.</div>
    <div id="dashboardError" class="dashboard-error" hidden></div>

    <div id="dashboardContent" class="dashboard-page" hidden>
        <section class="dashboard-section">
            <div class="dashboard-section-head">
                <h3>회원 현황</h3>
                <a th:href="@{/api/view/admin/members}">회원 관리 →</a>
            </div>
            <div id="memberCards" class="dashboard-stat-grid"></div>
        </section>

        <section class="dashboard-section">
            <div class="dashboard-section-head">
                <h3>점주 승인 현황</h3>
                <a th:href="@{/api/view/admin/owners(status='PENDING')}">승인 대기 목록 →</a>
            </div>
            <div id="ownerCards" class="dashboard-stat-grid"></div>
        </section>

        <section class="dashboard-section">
            <div class="dashboard-section-head">
                <h3>신고 현황</h3>
                <a th:href="@{/api/view/admin/reports}">신고 관리 →</a>
            </div>
            <div id="reportCards" class="dashboard-stat-grid"></div>
            <div class="dashboard-panel">
                <h4>동일 대상 신고 누적 상위</h4>
                <div id="duplicateTargets" class="dashboard-list"></div>
            </div>
        </section>

        <section class="dashboard-section">
            <div class="dashboard-section-head">
                <h3>AI 신고 처리 현황</h3>
                <a th:href="@{/api/view/admin/reports}">AI 신고 확인 →</a>
            </div>
            <div id="aiCards" class="dashboard-stat-grid"></div>
            <div class="dashboard-two-column">
                <div class="dashboard-panel">
                    <h4>최근 AI 자동 처리</h4>
                    <div id="recentAiAuto" class="dashboard-list"></div>
                </div>
                <div class="dashboard-panel">
                    <h4>최근 관리자 검토 필요</h4>
                    <div id="recentAiReview" class="dashboard-list"></div>
                </div>
            </div>
        </section>

        <section class="dashboard-section">
            <div class="dashboard-section-head">
                <h3>신뢰·제재 현황</h3>
                <a th:href="@{/api/view/admin/members}">회원 상태 확인 →</a>
            </div>
            <div id="trustCards" class="dashboard-stat-grid"></div>
        </section>

        <section class="dashboard-section">
            <div class="dashboard-section-head"><h3>최근 활동</h3></div>
            <div id="recentActivity" class="dashboard-activity-grid"></div>
        </section>
    </div>

    <script th:src="@{/js/admin/admin-dashboard.js}"></script>
</th:block>
</html>
