spring.application.name=haksik-mokjang
application-secret.properties


spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/project_mokjang?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
dev.dummy-data.enabled=false
app.demo-mode=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.profiles.include=local

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

file.upload.dir=/home/ubuntu/uploads
file.upload.url-prefix=/uploads

naver.map.client-id=${NAVER_MAP_CLIENT_ID:}

spring.profiles.active=local
server.port=9090
server.forward-headers-strategy=framework
server.servlet.session.persistent=false

# AI moderation provider. Official provider values: mock, claude.
ai.provider=${AI_PROVIDER:mock}
ai.claude.api-key=${CLAUDE_API_KEY:${ANTHROPIC_API_KEY:}}
ai.claude.model=${CLAUDE_MODEL:claude-sonnet-5}
ai.claude.recommendation-model=${CLAUDE_RECOMMENDATION_MODEL:claude-sonnet-5}
ai.claude.timeout-seconds=${CLAUDE_TIMEOUT_SECONDS:30}
ai.claude.base-url=${CLAUDE_BASE_URL:https://api.anthropic.com}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
